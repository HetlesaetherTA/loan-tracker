<style>
  .loan-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .loan-container {
    width: 40%;
    min-width: 320px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .loan-header {
    border-bottom: 2px solid #f9fafb;
    padding-bottom: 16px;
  }

  .loan-header h2 {
    margin: 0 0 8px 0;
    font-size: 1.5rem;
    color: #111827;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    background: #eff6ff;
    color: #1e40af;
  }

  .details-stack {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f9fafb;
    padding-bottom: 10px;
  }

  .row label {
    font-size: 0.85rem;
    color: #6b7280;
  }

  .row span {
    font-weight: 600;
    color: #1f2937;
    font-family: 'Courier New', Courier, monospace;
  }
</style>

<div class="loan-wrapper">
  <div class="loan-container">
    <div class="loan-header">
      <h2>{{.Description}}</h2>
      <span class="status-badge">{{.Status}}</span>
    </div>

    <div class="details-stack">
      <div class="row"><label>Current Principal</label><span>${{.Principal}}</span></div>
      <div class="row"><label>Original Principal</label><span>${{.OriginalPrincipal}}</span></div>
      <div class="row"><label>Yearly Interest</label><span>{{.YearlyInterest}}%</span></div>
      <div class="row"><label>Frequency</label><span>{{.PaymentFrequency}}</span></div>
      <div class="row"><label>Next Payment</label><span>{{.NextPaymentAt}}</span></div>
      <div class="row"><label>Due Date</label><span>{{.DueAt}}</span></div>
      <div class="row"><label>Interest Calc</label><span>{{.InterestCalculatedAt}}</span></div>
      <div class="row"><label>Last Updated</label><span>{{.UpdatedAt}}</span></div>
    </div>
  </div>
</div>
